- id: M1
  title: M1 Чувство езды и честная гонка
  goal: 'Довести ощущение руля и гонку против ИИ до «весело и честно»: тюнинг констант, различия классов и покрытий, кривая сложности ИИ.'
  done_when: Плейтест полной гонки даёт вердикт «напряжённо и честно».
  status: open
  issues:
  - {title: Tune car feel constants (buttery pass), types: [design], size: L, owner: both, body: 'Старый id: `balance-handling-feel` (balance/handling, big). Блокеры: «Front/rear grip + handbrake drift layer» (`code-vehicle-grip`).'}
  - {title: Differentiate feel across classes/brands, types: [design], size: M, owner: both, body: 'Старый id: `balance-handling-classes` (balance/handling, default). Блокеры: «Define car stat roster (classes S-D)» (`content-cars-roster`); «Drive handling from the 5 stat bars» (`code-vehicle-stats`).'}
  - {title: Tune grip values per surface + weather modifiers, types: [design], size: M, owner: both, body: 'Старый id: `balance-surfaces-grip` (balance/surfaces, default). Блокеры: «SurfaceType resources (asphalt/dirt/snow/sand/gravel/ice)» (`content-surfaces-defs`); «Weather grip modifier (stacks on surface grip)» (`code-track-weather-grip`).'}
  - {title: Difficulty via opponents + track complexity, types: [code], size: M, owner: claude, body: 'Старый id: `code-ai-difficulty` (code/ai, default). Блокеры: «AI rival driving a baked spline line» (`code-ai-rival`).'}
  - {title: AI pace/aggression curve, types: [design], size: M, owner: both, body: 'Старый id: `balance-difficulty-ai` (balance/difficulty, default). Блокеры: «Difficulty via opponents + track complexity» (`code-ai-difficulty`).'}
  - {title: 'Fun verdict: full race (tense + fair)', types: [design], size: M, owner: artemii, body: 'Старый id: `design-playtest-race` (design/playtest, default). Блокеры: «Win/lose + finishing place» (`code-race-result`); «AI rival driving a baked spline line» (`code-ai-rival`).'}
- id: M2
  title: M2 Вертикальный срез
  goal: Одна настоящая трасса и одна отполированная гонка от пре-рейса до результатов, с боссом.
  done_when: Плейтест вертикального среза пройден; первая трасса собрана из авторских карт.
  status: open
  issues:
  - {title: First real track (heightmap/surface/markers images), types: [design], size: L, owner: both, body: 'Старый id: `content-tracks-first` (content/tracks, big). Блокеры: «Bake tool as in-editor @tool button» (`code-track-bake-tool`).'}
  - {title: Boss-rival intro screen (car + class), types: [ui], size: M, owner: claude, body: 'Старый id: `code-ui-boss-intro` (code/ui, default). Блокеры: «Define 4 boss-rivals (brand + class per chapter)» (`content-rivals-defs`).'}
  - {title: 'Fun verdict: vertical slice (one polished race)', types: [design], size: M, owner: artemii, body: 'Старый id: `design-playtest-slice` (design/playtest, default). Блокеры: «Post-race results + rewards screen (reward line stubbed until economy)» (`code-ui-results`); «Engine audio: 3 RPM bands crossfaded + start/off cues» (`audio-sfx-engine`); «Voxel car: Kerb (Apex D, starter) — MV pipeline validation» (`art-voxel-car-kerb`).'}
- id: M3
  title: M3 Контент кампании
  goal: Набор трасс на 4 главы, таблицы выплат и цен, пейсинг прогрессии.
  done_when: Кампания проходится от первой гонки до четвёртого босса; плейтест цикла даёт «хочу следующую победу».
  status: open
  issues:
  - {title: Campaign track set (v1 regions x races), types: [design], size: XL, owner: both, body: 'Старый id: `content-tracks-campaign` (content/tracks, huge). Блокеры: «First real track (heightmap/surface/markers images)» (`content-tracks-first`); «4-chapter structure (class mixes, boss per chapter)» (`content-rivals-campaign`). Зонтичная задача: разбить на задачи по трекам, когда объём v1 (главы x трассы) зафиксируется в GDD.'}
  - {title: Payout/price tables (banked-best economy), types: [design], size: M, owner: both, body: 'Старый id: `balance-economy-tables` (balance/economy, default).'}
  - {title: Chapter CP-gate % + progression pacing, types: [design], size: M, owner: both, body: 'Старый id: `balance-difficulty-pacing` (balance/difficulty, default). Блокеры: «Chapter CP gate (~70%) + advance on boss win» (`code-meta-chapters`).'}
